# golangci-lint v2 config. `mise run lint` runs it (plus Redocly); `mise run fmt`
# formats. The linter is pinned in mise.toml and is a tool, not a Go dependency.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    exhaustive:
      # A `default:` branch is a deliberate catch-all, not a missed case.
      default-signifies-exhaustive: true
      # Foreign enums with many members we never switch on exhaustively.
      ignore-types: "^(gopkg\\.in/yaml\\.v3\\.Kind|reflect\\.Kind)$"
    thelper:
      # Helpers taking testing.TB name it t like every other test in the repo.
      tb:
        name: false
    usetesting:
      # Tests use t.Context() (Go 1.24) so their work is cancelled when they end.
      context-background: true
      context-todo: true
    gosec:
      excludes:
        # G104 (unchecked errors) duplicates errcheck, whose deliberate
        # exclusions are documented below; keeping both would force a second
        # suppression on every excluded call.
        - G104
    revive:
      # revive's default rules minus two that are noise here:
      #  - unused-parameter: HTTP handler and callback signatures are fixed.
      #  - exported: demands a doc comment on every exported name.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    errcheck:
      # Unactionable errors, excluded on purpose:
      #  - fmt.Fprint*: CLI and admin output to stdout/stderr or an in-memory
      #    buffer; there is nowhere to report a failed terminal write.
      #  - Close on HTTP response bodies and database handles/rows: read-side
      #    cleanup, where the error carries no data loss (rows.Err and the
      #    query error are checked separately).
      # Close on files that were written to is not excluded and must be checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback # deferred after commit/failure; the original error wins
        - (*bufio.Writer).Write # errors are sticky and surface at Flush, which is checked
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteByte
    staticcheck:
      # Same checks the standalone staticcheck gate ran: the default set,
      # without the QF quick-fix suggestions.
      checks: ["all", "-QF*", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]

  exclusions:
    rules:
      # `defer x.Close()` of test fixtures (stores, servers, clients): a failed
      # close at the end of a test has nothing to report to.
      - path: _test\.go
        linters: [errcheck]
        text: "Error return value of `[^`]*\\.Close` is not checked"
      # These loops close `rows` explicitly, before the next query on the same
      # connection, instead of with defer; moving to defer would change when
      # the connection is released.
      - path: internal/store/(postgres|sqlite)/(history|quizzes|tags|users)\.go
        linters: [sqlclosecheck]
      # Tests build requests and open connections without a context on purpose
      # (httptest recorders have no body to close, nothing to cancel); rewriting
      # ~125 call sites would be churn with no gain.
      - path: _test\.go
        linters: [noctx, bodyclose]
      # The conformance suite bodies (run*/Run* taking t and a store factory)
      # are tests, not helpers: t.Helper() there would report every failed
      # assertion at the caller's t.Run line.
      - path: internal/store/storetest/
        linters: [thelper]
        source: '^func (run|Run)\w*\(t \*testing\.T'
      # gosec in test code (and the storetest conformance suite), rule by rule:
      #  - G101/G124: fake cookies and credentials a test client sends.
      #  - G107/G710/G705/G703: fixture servers and fake IdPs echo or follow
      #    test-controlled URLs, paths and bodies.
      #  - G115: tiny counters turned into fixture IDs.
      #  - G204: runs pinned tools (node, promtool) on repo files.
      #  - G301/G304/G306: golden files and fixture I/O in testdata or t.TempDir.
      #  - G404: seeded math/rand for reproducible randomized cases.
      # Production code gets no blanket exclusion: each finding there is
      # audited and suppressed in place with a reason.
      - path: (_test\.go|internal/store/storetest/)
        linters: [gosec]
        text: "^G(101|107|115|124|204|301|304|306|404|703|705|710):"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/chan-labs/quizzotic

issues:
  max-issues-per-linter: 0 # report everything; the default caps hide findings
  max-same-issues: 0
