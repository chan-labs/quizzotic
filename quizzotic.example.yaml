# Example Quizzotic configuration. Copy to quizzotic.yaml and edit.
# Any key can be overridden by an environment variable named QUIZZOTIC_ plus
# the key path in upper snake case, e.g. QUIZZOTIC_SERVER_PUBLIC_URL.
# Unknown keys and invalid values are refused at start-up. Tracing is
# configured only by the standard OTEL_* environment variables.
# All hosts below are placeholders; use your own.
server:
  listen: ":8080"
  public_url: "https://quizzotic.example.com"   # required for serve
  session_ttl: "720h"
storage:
  url: "sqlite://quizzotic.db"   # sqlite://<path>, or postgres:// / postgresql://user:pass@host/db
  # Loaded on start, but only when the store has exactly one user. On a fresh
  # instance there is none until the first sign-in, so startup logs a warning and
  # skips; seeding then runs on the next restart, or at once with
  # `quizzotic admin seed builtin:fsrs-basics --owner <user id>`.
  seed: ["builtin:fsrs-basics"]
  auto_migrate: true             # apply pending migrations on start
auth:
  issuers:                       # v1: exactly one
    - name: "example-idp"
      issuer: "https://auth.example.com"
      # Accepted access-token audiences: one string, or a list. Pocket ID sets
      # aud to the OAuth client ID, so list every client's ID here.
      audience: ["quizzotic-web", "quizzotic-cli", "quizzotic-agent", "quizzotic-headless"]
      scopes: ["openid", "profile", "email"]
      clients:
        - id: "quizzotic-web"
          kind: "human"
          secret: ""             # set via QUIZZOTIC_AUTH_ISSUERS_0_CLIENTS_0_SECRET
        - id: "quizzotic-cli"
          kind: "human"
        - id: "quizzotic-agent"
          kind: "agent"
          allowed_scopes: ["problems:read", "problems:write", "tags:read", "tags:write", "quizzes:read", "quizzes:write", "metrics:read"]
        - id: "quizzotic-headless"   # client-credentials grant
          kind: "agent"
          acts_for: "00000000-0000-0000-0000-000000000000"   # issuer "sub" of the human it acts for
          allowed_scopes: ["problems:read", "problems:write", "tags:read", "tags:write", "metrics:read"]
scheduling:
  desired_retention: 0.90
  learning_steps: ["1m", "10m"]
  new_per_day: 20
  max_reviews_per_day: 200
  new_interval: 4
  weak_tag_boost: 1.0
  rollover_hour: 4
  # IANA zone used for every user who has not set their own time zone in Settings.
  # Change it whenever you like (restart to apply): it moves those users' study-day
  # boundary. It does not touch users' own zones or stored data.
  default_timezone: "America/New_York"
logging:
  level: "info"                  # debug, info, warn, error
  format: "json"                 # json or text
observability:
  metrics_enabled: false         # serve Prometheus metrics at GET /metrics (unauthenticated; restrict at the network)
