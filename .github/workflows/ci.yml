name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5.2.5
        with:
          cache: true
      - name: lint (go vet, staticcheck, Redocly)
        run: mise run lint

  openapi:
    name: openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5.2.5
        with:
          cache: true
          install_args: node
      - name: lint api/openapi.yaml
        run: mise run openapi-lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5.2.5
        with:
          cache: true
          install_args: go
      # internal/web runs static/review.js under Node; without it that test
      # would skip, so CI installs Node and requires it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: go test
        env:
          QUIZZOTIC_REQUIRE_NODE: "1"
        run: mise run test

  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quizzotic
          POSTGRES_PASSWORD: quizzotic
          POSTGRES_DB: quizzotic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizzotic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUIZZOTIC_TEST_POSTGRES_URL: postgres://quizzotic:quizzotic@localhost:5432/quizzotic?sslmode=disable
      QUIZZOTIC_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5.2.5
        with:
          cache: true
          install_args: go
      - name: postgres store tests (conformance, migrations, append-only triggers)
        run: go test -race -count=1 -v ./internal/store/postgres ./internal/store/driver

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            goos: linux
          - name: darwin
            goos: darwin
          - name: windows
            goos: windows
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5.2.5
        with:
          cache: true
          install_args: go
      - name: go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build ./...

  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5.2.5
        with:
          cache: true
          install_args: go
      - name: goreleaser check
        run: mise run release-check
