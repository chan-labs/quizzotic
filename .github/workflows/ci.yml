name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3' # keep in sync with .tool-versions
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

  openapi:
    name: openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: lint api/openapi.yaml
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3' # keep in sync with .tool-versions
      - name: go test
        run: go test -race ./...

  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quizzotic
          POSTGRES_PASSWORD: quizzotic
          POSTGRES_DB: quizzotic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizzotic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUIZZOTIC_TEST_POSTGRES_URL: postgres://quizzotic:quizzotic@localhost:5432/quizzotic?sslmode=disable
      QUIZZOTIC_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3' # keep in sync with .tool-versions
      - name: postgres store tests (conformance, migrations, append-only triggers)
        run: go test -race -count=1 -v ./internal/store/postgres

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            goos: linux
          - name: darwin
            goos: darwin
          - name: windows
            goos: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3' # keep in sync with .tool-versions
      - name: go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build ./...

  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3' # keep in sync with .tool-versions
      - name: goreleaser check
        run: make release-check
