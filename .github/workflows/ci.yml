name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new advisories against an unchanged main are caught.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Keyed on the event too, so the weekly run and a push to main don't cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # the weekly run is only for vulncheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: go golangci-lint actionlint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-lint-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ hashFiles('go.sum') }}-
            go-lint-
      - name: golangci-lint and format check
        run: mise run lint-go

  openapi:
    name: openapi
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # the weekly run is only for vulncheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node
      - name: lint api/openapi.yaml
        run: mise run openapi-lint

  test:
    name: test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # the weekly run is only for vulncheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: go
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ hashFiles('go.sum') }}-
            go-test-
      # internal/web runs static/review.js under Node; without it that test
      # would skip, so CI installs Node and requires it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: go test
        env:
          QUIZZOTIC_REQUIRE_NODE: "1"
        run: mise run test

  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # the weekly run is only for vulncheck
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quizzotic
          POSTGRES_PASSWORD: quizzotic
          POSTGRES_DB: quizzotic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizzotic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUIZZOTIC_TEST_POSTGRES_URL: postgres://quizzotic:quizzotic@localhost:5432/quizzotic?sslmode=disable
      QUIZZOTIC_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: go
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-postgres-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-postgres-${{ hashFiles('go.sum') }}-
            go-test-postgres-
      - name: postgres store tests (conformance, migrations, append-only triggers)
        run: go test -race -count=1 -v ./internal/store/postgres ./internal/store/driver

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # the weekly run is only for vulncheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            goos: linux
          - name: darwin
            goos: darwin
          - name: windows
            goos: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: go
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ matrix.name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ matrix.name }}-${{ hashFiles('go.sum') }}-
            go-build-${{ matrix.name }}-
      - name: go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build ./...

  release-config:
    name: release config
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # the weekly run is only for vulncheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Prebuilt goreleaser from mise.toml: no Go toolchain or module downloads.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: goreleaser
      - name: goreleaser check
        run: mise run release-check

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-vulncheck-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-vulncheck-${{ hashFiles('go.sum') }}-
            go-vulncheck-
      - name: govulncheck
        run: mise run vulncheck
