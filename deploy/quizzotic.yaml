# Sample Quizzotic config for deploy/docker-compose.yaml.
# server.public_url, the issuer URL and the web client secret are overridden
# by the compose file from .env; the values here are placeholders.
server:
  listen: ":8080"
  public_url: "https://quizzotic.example.com"
storage:
  url: "sqlite:///data/quizzotic.db"
  auto_migrate: true
auth:
  issuers:
    - name: "pocketid"
      issuer: "https://auth.example.com"
      # Pocket ID sets aud to the client ID: list the generated IDs of the clients below.
      audience: ["quizzotic-web", "quizzotic-cli", "quizzotic-agent"]
      scopes: ["openid", "profile", "email"]
      clients:
        - id: "quizzotic-web"
          kind: "human"
          secret: ""             # from QUIZZOTIC_WEB_CLIENT_SECRET in .env
        - id: "quizzotic-cli"
          kind: "human"
        - id: "quizzotic-agent"
          kind: "agent"
          allowed_scopes: ["problems:read", "problems:write", "tags:read", "tags:write", "quizzes:read", "quizzes:write", "metrics:read"]
scheduling:
  # Default time zone for users who have not set their own in Settings. Change
  # it any time and restart; per-user zones and stored data are unaffected.
  default_timezone: "America/New_York"
logging:
  level: "info"
  format: "json"
