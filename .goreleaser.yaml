# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: quizzotic

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: quizzotic
    main: ./cmd/quizzotic
    binary: quizzotic
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - quizzotic.example.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

dockers_v2:
  - id: image
    dockerfile: Dockerfile
    images:
      - ghcr.io/chan-labs/quizzotic
    tags:
      - "{{ .Version }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: quizzotic
      org.opencontainers.image.source: https://github.com/chan-labs/quizzotic
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

release:
  github:
    owner: chan-labs
    name: quizzotic
  prerelease: auto
