# Local tracing stack: Grafana + Tempo + OpenTelemetry collector in one
# container (grafana/otel-lgtm). DEV ONLY. Run with `mise run dev-otel`.
#   Grafana        http://localhost:3000 (anonymous admin; Explore > Tempo)
#   OTLP gRPC      localhost:4317
#   OTLP HTTP      localhost:4318
# Point quizzotic at it with QUIZZOTIC_DEV_OTEL=1 mise run dev, or by setting
# OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 yourself.
name: quizzotic-otel
services:
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
